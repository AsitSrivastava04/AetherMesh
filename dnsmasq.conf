# =============================================================================
# Aether Mesh - dnsmasq Captive Portal Configuration Template
# =============================================================================
# PURPOSE: Spoof all DNS lookups to the gateway IP so that any device
# connecting to the hotspot is instantly redirected to the Aether Mesh PWA.
#
# USAGE:
#   1. Replace GATEWAY_IP with your actual laptop hotspot IP (e.g. 192.168.137.1)
#   2. Copy this file to /etc/dnsmasq.conf (Linux) or equivalent
#   3. Run: sudo systemctl restart dnsmasq
# =============================================================================

# ---- Network Interface -------------------------------------------------------
# Bind only to the hotspot interface (e.g. wlan0 or ap0)
interface=wlan0
bind-interfaces

# ---- DNS Sinkhole (Captive Portal Trap) ------------------------------------
# Route every DNS query to the gateway IP so browsers trigger the captive-
# portal login flow and land on https://GATEWAY_IP:3000
address=/#/192.168.137.1

# ---- Specific Captive Portal Probe Endpoints --------------------------------
# Android / Chrome OS
address=/connectivitycheck.gstatic.com/192.168.137.1
address=/connectivitycheck.android.com/192.168.137.1
address=/clients3.google.com/192.168.137.1
address=/clients1.google.com/192.168.137.1

# Apple iOS / macOS
address=/captive.apple.com/192.168.137.1
address=/www.apple.com/library/test/success.html/192.168.137.1
address=/appleiphonecell.com/192.168.137.1
address=/apple.com/192.168.137.1
address=/gsp1.apple.com/192.168.137.1
address=/neverssl.com/192.168.137.1

# Mozilla Firefox
address=/detectportal.firefox.com/192.168.137.1
address=/firefox.com/192.168.137.1
address=/mozilla.org/192.168.137.1

# Microsoft Windows / Edge
address=/www.msftncsi.com/192.168.137.1
address=/ipv6.msftncsi.com/192.168.137.1
address=/www.msftconnecttest.com/192.168.137.1

# ---- DHCP Server (assign IPs to joining devices) ----------------------------
dhcp-range=192.168.137.50,192.168.137.150,12h
dhcp-option=3,192.168.137.1    # Default gateway
dhcp-option=6,192.168.137.1    # DNS server = ourselves

# ---- Logging (optional, disable on resource-constrained hardware) -----------
# log-queries
# log-facility=/var/log/dnsmasq.log
